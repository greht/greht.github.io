<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Recuperar contraseña - PredictiLab</title>
    <link rel="stylesheet" href="CSS/styles.css" />
    <link rel="stylesheet" href="CSS/login.css" />
  </head>
  <body class="login-page">
    <header class="navbar">
      <div class="logo">
        <a href="index.html" class="logo">
          <img
            class="logo-icon"
            src="assets/images/Fondo-blanco.svg"
            alt="Logo PredictiLab"
          />
          <span class="logo-text">PredictiLab</span>
        </a>
      </div>
    </header>

    <main class="login-container">
      <div class="login-left">
        <picture>
          <source srcset="assets/images/login.webp" type="image/webp" />
          <img src="assets/images/login.png" alt="login" decoding="async" />
        </picture>
      </div>

      <div class="login-card">
        <div class="logo1">
          <img
            class="logo1-icon"
            src="assets/images//Fondo-oscuro.svg"
            alt="Logo PredictiLab"
          />
          <span class="logo1-text">PredictiLab</span>
        </div>

        <div class="head-card">
          <h2 class="title-up">Recuperar contraseña</h2>
          <span class="title-down"
            >Ingresa tu <strong class="color-highlight">email</strong> y te
            enviaremos un enlace para restablecer tu contraseña ⚽</span
          >
        </div>

        <form id="forgotForm">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
          />

          <div id="forgotMessage"></div>

          <button type="submit" class="btn-primary" id="btnSubmit">
            Enviar enlace de recuperación
            <svg class="icon-entrar">
              <use href="assets/icons/icons.svg#icon-entrar"></use>
            </svg>
          </button>

          <div class="link-create-account">
            <a href="login.html" class="accent-link">
              <strong class="create-account">Volver al inicio de sesión</strong>
            </a>
          </div>
        </form>
      </div>
    </main>

    <footer class="secondary-footer">
      <div class="secondary-footer-container">
        <div class="secondary-footer-left">
          <span class="logo1-text">PredictiLab.com</span>
        </div>

        <div class="secondary-footer-center">
          <a href="tyc.html">Términos del servicio</a>
          <a href="contacto.html">Contáctanos</a>
        </div>

        <div class="secondary-footer-right">
          <span>© 2026 PredictiLab - Greht Fernández</span>
        </div>
      </div>
    </footer>
    <script type="module" src="js/pages/forgot-password.js"></script>
  </body>
</html>
