<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - PredictiLab</title>
<link rel="stylesheet" href="CSS/styles.css" />
    <link rel="stylesheet" href="CSS/login.css" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet" />
  
</head>
<body class="register-page">

    <header class="navbar">
        <div class="logo">
            <a href="index.html" class="logo">
            <img
              class="logo-icon"
              src="assets/images/Fondo-blanco.svg"
              alt="Logo PredictiLab"
            />
            <span class="logo-text">PredictiLab</span>
          </a>
        </div>

        <div class="nav-actions">
            <button class="btn btn-sesion" onclick="window.location.href='login.html'">Iniciar sesión</button>
        </div>
    </header>

    <main class="login-container">

        <div class="login-left">
            <picture>
              <source srcset="assets/images/login.webp" type="image/webp" />
              <img src="assets/images/login.png" alt="login" decoding="async" />
            </picture>
        </div>

        <div class="login-card">
            <div class="logo1">
          <img
            class="logo1-icon"
            src="assets/images//Fondo-oscuro.svg"
            alt="Logo PredictiLab"
          />
          <span class="logo1-text">PredictiLab</span>
        </div>
        
<div class="register-card">
            <div class="head-card">
                <h2 class="title-up">Únete al juego</h2>
                <span class="title-down">Crea tu <strong class="color-highlight">cuenta</strong> y empieza a predecir partidos ⚽</span>
            </div>

            <form id="registerForm">
            
                <label for="username">Nombre de usuario</label>
                <input 
                    type="username" 
                    id="username"
                    name="username"
                    placeholder="El nombre que verán en tu liga"
                    required
                >

                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email"
                    name="email"
                    placeholder="ejemplo@correo.com"
                    required
                >

                <label for="country">País</label>
                    <select id="country" name="country" required>
                    <option value="" disabled selected hidden>País donde juegas</option>
                </select>

                <label for="password">Contraseña</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        required
                    >
                    <button type="button" class="toggle-password" data-target="password">
                        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <label for="repeat-password">Repetir contraseña</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="repeat-password"
                        name="repeat-password"
                        placeholder="Confirma tu contraseña"
                        required
                    >
                    <button type="button" class="toggle-password" data-target="repeat-password">
                        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                
                <div class="info">
                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Confirmo que soy mayor de 18 años
                        </label>

                        <label class="checkbox">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                                <span>
                                    Acepto los
                                    <a href="tyc.html"><strong>términos y condiciones</strong></a>
                                </span>
                        </label>
                    </div>

            
                </div>


                <button type="submit" class="btn-primary">Empezar a jugar
                    <svg class="icon-entrar">
                        <use href="assets/icons/icons.svg#icon-entrar"></use>
                    </svg>
                </button>


                <div class="link-create-account">
                    <a>
                        ¿Ya tienes una cuenta? 
                    </a>
                    <a href="login.html" class="accent-link">
                        <strong class="create-account">Iniciar sesión</strong>
                    </a>
                </div>

            </form>

        </div>

    </main>

    <footer class="secondary-footer">
        <div class="secondary-footer-container">

            <div class="secondary-footer-left">
            <span class="logo1-text">PredictiLab.com</span>
            </div>

            <div class="secondary-footer-center">
                <a href="tyc.html">Términos del servicio</a>
                <a href="contacto.html">Contáctanos</a>
            </div>

            <div class="secondary-footer-right">
            <span>© 2026 PredictiLab - Greht Fernández</span>
            </div>

        </div>
    </footer>
    <script type="module" src="js/register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
